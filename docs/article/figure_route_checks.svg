<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="900" viewBox="0 0 1240 900" font-family="DejaVu Sans, Noto Sans, Liberation Sans, sans-serif">
<defs>
<marker id="aK" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a3a3a"/></marker>
<marker id="aB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f5fa8"/></marker>
<marker id="aG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a7a7a"/></marker>
<marker id="aO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c25a00"/></marker>
<marker id="aR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b3261e"/></marker>
<marker id="aE" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/></marker>
</defs>
<rect x="0" y="0" width="1240" height="900" fill="#ffffff"/>
<text x="24" y="38" font-size="22" font-weight="bold" fill="#1d1d1d">The move in the handover library, with its route checks</text>
<rect x="60" y="70" width="620" height="66" rx="8" fill="#ffffff" stroke="#3a3a3a" stroke-width="1.6"/>
<text x="72" y="99" font-size="14" font-weight="bold" text-anchor="start" fill="#1d1d1d">1  Checks before</text>
<text x="72" y="117" font-size="12" text-anchor="start" fill="#555555">target reachable, registered at the IN-CSE, ready in MEC 011; route = the source alone</text>
<line x1="370" y1="136" x2="370" y2="152" stroke="#3a3a3a" stroke-width="2" marker-end="url(#aK)"/>
<rect x="60" y="152" width="620" height="66" rx="8" fill="#ffffff" stroke="#3a3a3a" stroke-width="1.6"/>
<text x="72" y="181" font-size="14" font-weight="bold" text-anchor="start" fill="#1d1d1d">2  Lock</text>
<text x="72" y="199" font-size="12" text-anchor="start" fill="#555555">a transaction container on the IN-CSE, with an expiry</text>
<line x1="370" y1="218" x2="370" y2="234" stroke="#3a3a3a" stroke-width="2" marker-end="url(#aK)"/>
<rect x="60" y="234" width="620" height="66" rx="8" fill="#ffffff" stroke="#3a3a3a" stroke-width="1.6"/>
<text x="72" y="263" font-size="14" font-weight="bold" text-anchor="start" fill="#1d1d1d">3  Create the AE on the target</text>
<text x="72" y="281" font-size="12" text-anchor="start" fill="#555555">with announcement to the IN-CSE (at, aa)</text>
<line x1="370" y1="300" x2="370" y2="316" stroke="#3a3a3a" stroke-width="2" marker-end="url(#aK)"/>
<rect x="60" y="316" width="620" height="66" rx="8" fill="#fdf0e6" stroke="#c25a00" stroke-width="1.6"/>
<text x="72" y="345" font-size="14" font-weight="bold" text-anchor="start" fill="#1d1d1d">4  Route check</text>
<text x="72" y="363" font-size="12" text-anchor="start" fill="#555555">the IN routes the vehicle to source AND target, nothing else (wait up to 2 s)</text>
<line x1="370" y1="382" x2="370" y2="398" stroke="#3a3a3a" stroke-width="2" marker-end="url(#aK)"/>
<line x1="680" y1="349" x2="800" y2="349" stroke="#b3261e" stroke-width="2" marker-end="url(#aR)"/>
<text x="740" y="341" font-size="12" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" fill="#b3261e">no</text>
<rect x="60" y="398" width="620" height="66" rx="8" fill="#ffffff" stroke="#3a3a3a" stroke-width="1.6"/>
<text x="72" y="427" font-size="14" font-weight="bold" text-anchor="start" fill="#1d1d1d">5  Copy and verify</text>
<text x="72" y="445" font-size="12" text-anchor="start" fill="#555555">containers, every sample, access control policies, subscriptions</text>
<line x1="370" y1="464" x2="370" y2="480" stroke="#3a3a3a" stroke-width="2" marker-end="url(#aK)"/>
<rect x="60" y="480" width="620" height="66" rx="8" fill="#fdf0e6" stroke="#c25a00" stroke-width="1.6"/>
<text x="72" y="509" font-size="14" font-weight="bold" text-anchor="start" fill="#1d1d1d">6  Route check again</text>
<text x="72" y="527" font-size="12" text-anchor="start" fill="#555555">still source and target</text>
<line x1="370" y1="546" x2="370" y2="562" stroke="#3a3a3a" stroke-width="2" marker-end="url(#aK)"/>
<polyline points="680,513 760,513 760,430 798,430" fill="none" stroke="#b3261e" stroke-width="2" marker-end="url(#aR)"/>
<text x="720" y="505" font-size="12" text-anchor="middle" fill="#b3261e">no</text>
<rect x="60" y="562" width="620" height="66" rx="8" fill="#ffffff" stroke="#3a3a3a" stroke-width="1.6"/>
<text x="72" y="591" font-size="14" font-weight="bold" text-anchor="start" fill="#1d1d1d">7  Resume the device on the target</text>
<text x="72" y="609" font-size="12" text-anchor="start" fill="#555555">then forget the rollback list</text>
<line x1="370" y1="628" x2="370" y2="644" stroke="#3a3a3a" stroke-width="2" marker-end="url(#aK)"/>
<rect x="60" y="644" width="620" height="66" rx="8" fill="#ffffff" stroke="#3a3a3a" stroke-width="1.6"/>
<text x="72" y="673" font-size="14" font-weight="bold" text-anchor="start" fill="#1d1d1d">8  Release the source</text>
<text x="72" y="691" font-size="12" text-anchor="start" fill="#555555">DELETE on the source edge</text>
<line x1="370" y1="710" x2="370" y2="726" stroke="#3a3a3a" stroke-width="2" marker-end="url(#aK)"/>
<rect x="60" y="726" width="620" height="66" rx="8" fill="#fdf0e6" stroke="#c25a00" stroke-width="1.6"/>
<text x="72" y="755" font-size="14" font-weight="bold" text-anchor="start" fill="#1d1d1d">9  Final check</text>
<text x="72" y="773" font-size="12" text-anchor="start" fill="#555555">the IN routes to the target alone, and the source is gone</text>
<rect x="800" y="300" width="400" height="150" rx="8" fill="#fbeaea" stroke="#b3261e" stroke-width="1.6"/>
<text x="1000" y="353" font-size="14" font-weight="bold" text-anchor="middle" fill="#1d1d1d">ROLLED BACK (not moved)</text>
<text x="1000" y="371" font-size="12" text-anchor="middle" fill="#555555">the target copy is deleted;</text>
<text x="1000" y="389" font-size="12" text-anchor="middle" fill="#555555">the source keeps everything;</text>
<text x="1000" y="407" font-size="12" text-anchor="middle" fill="#555555">the device stays on edge A</text>
<line x1="680" y1="759" x2="800" y2="759" stroke="#b3261e" stroke-width="2" marker-end="url(#aR)"/>
<text x="740" y="751" font-size="12" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" fill="#b3261e">no</text>
<rect x="800" y="650" width="400" height="110" rx="8" fill="#fbeaea" stroke="#b3261e" stroke-width="1.6"/>
<text x="1000" y="692" font-size="14" font-weight="bold" text-anchor="middle" fill="#1d1d1d">INCONSISTENT (reported, not success)</text>
<text x="1000" y="710" font-size="12" text-anchor="middle" fill="#555555">nothing is rolled back after the release:</text>
<text x="1000" y="728" font-size="12" text-anchor="middle" fill="#555555">every copy is kept, so nothing is lost</text>
<line x1="370" y1="792" x2="370" y2="830" stroke="#2e7d32" stroke-width="2" marker-end="url(#aE)"/>
<rect x="220" y="830" width="300" height="50" rx="8" fill="#e8f3ea" stroke="#2e7d32" stroke-width="1.6"/>
<text x="370" y="860" font-size="14" font-weight="bold" text-anchor="middle" fill="#1d1d1d">MOVED</text>
<text x="800" y="500" font-size="13" text-anchor="start" fill="#1d1d1d">Why steps 4, 6 and 9 exist: with tinyIoT as edge B,</text>
<text x="800" y="520" font-size="13" text-anchor="start" fill="#1d1d1d">the AE was created (201) but its announcement</text>
<text x="800" y="540" font-size="13" text-anchor="start" fill="#1d1d1d">never reached the IN-CSE, and the old code</text>
<text x="800" y="560" font-size="13" text-anchor="start" fill="#1d1d1d">reported success with no route at all.</text>
<text x="800" y="586" font-size="12" text-anchor="start" fill="#555555">Records: tinyiot run2 (the fault), commit 37fdfb9 (the fix).</text>
</svg>
