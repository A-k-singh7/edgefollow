<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="700" viewBox="0 0 1240 700" font-family="DejaVu Sans, Noto Sans, Liberation Sans, sans-serif">
<defs>
<marker id="aK" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a3a3a"/></marker>
<marker id="aB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f5fa8"/></marker>
<marker id="aG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a7a7a"/></marker>
<marker id="aO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c25a00"/></marker>
<marker id="aR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b3261e"/></marker>
<marker id="aE" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/></marker>
</defs>
<rect x="0" y="0" width="1240" height="700" fill="#ffffff"/>
<text x="24" y="38" font-size="22" font-weight="bold" fill="#1d1d1d">One move, two oneM2M implementations: ACME and tinyIoT</text>
<rect x="420" y="70" width="400" height="150" rx="8" fill="#ffffff" stroke="#3a3a3a" stroke-width="1.6"/>
<text x="620" y="123" font-size="14" font-weight="bold" text-anchor="middle" fill="#1d1d1d">IN-CSE (ACME 2026.5.3)</text>
<text x="620" y="141" font-size="12" text-anchor="middle" fill="#555555">one CSEBaseAnnc per edge</text>
<text x="620" y="159" font-size="12" text-anchor="middle" fill="#555555">announced AE of the vehicle</text>
<text x="620" y="177" font-size="12" text-anchor="middle" fill="#555555">= the route the move checks</text>
<rect x="80" y="330" width="320" height="110" rx="8" fill="#ffffff" stroke="#3a3a3a" stroke-width="1.6"/>
<text x="240" y="372" font-size="14" font-weight="bold" text-anchor="middle" fill="#1d1d1d">MN-CSE A</text>
<text x="240" y="390" font-size="12" text-anchor="middle" fill="#555555">ACME 2026.5.3</text>
<text x="240" y="408" font-size="12" text-anchor="middle" fill="#555555">/id-mn-a</text>
<rect x="840" y="330" width="320" height="110" rx="8" fill="#fdf0e6" stroke="#c25a00" stroke-width="1.6"/>
<text x="1000" y="372" font-size="14" font-weight="bold" text-anchor="middle" fill="#1d1d1d">MN-CSE B</text>
<text x="1000" y="390" font-size="12" text-anchor="middle" fill="#555555">tinyIoT c140495, same identity</text>
<text x="1000" y="408" font-size="12" text-anchor="middle" fill="#555555">/id-mn-b</text>
<line x1="400" y1="370" x2="840" y2="370" stroke="#3a3a3a" stroke-width="2" marker-end="url(#aK)"/>
<text x="620" y="360" font-size="12" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" fill="#3a3a3a">ACME -&gt; tinyIoT: PASS</text>
<line x1="840" y1="410" x2="400" y2="410" stroke="#3a3a3a" stroke-width="2" marker-end="url(#aK)"/>
<text x="620" y="430" font-size="12" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" fill="#3a3a3a">tinyIoT -&gt; ACME: PASS</text>
<line x1="240" y1="330" x2="480" y2="220" stroke="#3a3a3a" stroke-width="2" marker-end="url(#aK)"/>
<text x="330" y="262" font-size="12" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" fill="#3a3a3a">announces</text>
<text x="330" y="277" font-size="12" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" fill="#3a3a3a">the AE</text>
<line x1="1000" y1="330" x2="760" y2="220" stroke="#3a3a3a" stroke-width="2" marker-end="url(#aK)"/>
<text x="910" y="262" font-size="12" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" fill="#3a3a3a">announces</text>
<text x="910" y="277" font-size="12" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" fill="#3a3a3a">the AE</text>
<text x="620" y="470" font-size="14" font-weight="bold" text-anchor="middle" fill="#1d1d1d">Full scenario with MEC 013, 012 and 040, tinyIoT as edge B: 10 of 10 steps (2026-11-21)</text>
<rect x="80" y="520" width="1080" height="130" rx="8" fill="#fbeaea" stroke="#b3261e" stroke-width="1.6"/>
<text x="92" y="563" font-size="14" font-weight="bold" text-anchor="start" fill="#1d1d1d">Found on the way, in tinyIoT (to be reported)</text>
<text x="92" y="581" font-size="12" text-anchor="start" fill="#555555">after a restart with a fresh database, its CSEBaseAnnc at the IN already exists: the IN answers 409;</text>
<text x="92" y="599" font-size="12" text-anchor="start" fill="#555555">tinyIoT then guesses the name /id-in/-/id-mn-b_cba, which it never asked for: 404; the AE is still</text>
<text x="92" y="617" font-size="12" text-anchor="start" fill="#555555">created (201), but no announcement reaches the IN. The library's route checks now refuse such a move.</text>
</svg>
