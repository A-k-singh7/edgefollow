<text x="28" y="650" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#555">Names as in the lab code; a composite of the lab's runs. The phone's containers keep at most 2000 instances (mni). In the</text>
<text x="28" y="669" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#555">move, the AE "phone" goes to MN-CSE B with all its child resources, and its announced copy goes under id-mn-b at the IN-CSE.</text>
