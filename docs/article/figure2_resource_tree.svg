<text x="1398" y="319" text-anchor="end" font-family="DejaVu Sans, sans-serif" font-size="12.5" fill="#666">create only</text>
<text x="968" y="342" font-family="DejaVu Sans Mono, monospace" font-size="13.5"><tspan fill="#9aa5b1">   ├─ </tspan><tspan fill="#2e7d32" font-weight="bold">&lt;cnt&gt;</tspan><tspan fill="#1d1d1d" font-weight="bold"> ue-registry</tspan></text>
<text x="1398" y="342" text-anchor="end" font-family="DejaVu Sans, sans-serif" font-size="12.5" fill="#666">operator writes</text>
<text x="968" y="365" font-family="DejaVu Sans Mono, monospace" font-size="13.5"><tspan fill="#9aa5b1">   ├─ </tspan><tspan fill="#2e7d32" font-weight="bold">&lt;cnt&gt;</tspan><tspan fill="#1d1d1d" font-weight="bold"> location</tspan></text>
