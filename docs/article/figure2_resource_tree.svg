<text x="520" y="204" font-family="DejaVu Sans Mono, monospace" font-size="13.5"><tspan fill="#9aa5b1">├─ </tspan><tspan fill="#1d1d1d" font-weight="bold">&lt;AE&gt;</tspan><tspan fill="#1d1d1d" font-weight="bold"> hoPolicy</tspan></text>
