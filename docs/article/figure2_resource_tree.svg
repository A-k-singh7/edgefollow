<text x="520" y="135" font-family="DejaVu Sans Mono, monospace" font-size="13.5"><tspan fill="#9aa5b1">├─ </tspan><tspan fill="#555555" font-weight="bold">&lt;csr&gt;</tspan><tspan fill="#1d1d1d" font-weight="bold"> id-mn-a</tspan></text>
