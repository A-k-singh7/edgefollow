<text x="1097.6000000000001" y="616" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#444">remoteCSE</text>
<text x="1190.2000000000003" y="616" font-family="DejaVu Sans Mono, monospace" font-size="13" font-weight="bold" fill="#555555">&lt;AEAnnc&gt;</text>
