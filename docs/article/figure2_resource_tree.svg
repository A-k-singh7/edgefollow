<text x="520" y="296" font-family="DejaVu Sans Mono, monospace" font-size="13.5"><tspan fill="#9aa5b1">   ├─ </tspan><tspan fill="#2e7d32" font-weight="bold">&lt;cnt&gt;</tspan><tspan fill="#1d1d1d" font-weight="bold"> tasks</tspan></text>
