<text x="918" y="227" text-anchor="end" font-family="DejaVu Sans, sans-serif" font-size="12.5" fill="#666">latest instance in force</text>
<text x="520" y="250" font-family="DejaVu Sans Mono, monospace" font-size="13.5"><tspan fill="#9aa5b1">│  └─ </tspan><tspan fill="#2e7d32" font-weight="bold">&lt;cnt&gt;</tspan><tspan fill="#1d1d1d" font-weight="bold"> events</tspan></text>
