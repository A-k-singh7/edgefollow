<text x="28" y="40" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="bold" fill="#1d1d1d">EdgeFollow: the oneM2M resource tree, before the move</text>
<rect x="28" y="60" width="456" height="507" rx="12" fill="#f7f8fa" stroke="#9aa5b1" stroke-width="1.4"/>
<text x="44" y="86" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="bold" fill="#33475b">MN-CSE A (cse-mn-a): the devices</text>
<text x="44" y="112" font-family="DejaVu Sans Mono, monospace" font-size="13.5"><tspan fill="#9aa5b1"></tspan><tspan fill="#1d1d1d" font-weight="bold">&lt;CSEBase&gt;</tspan><tspan fill="#1d1d1d" font-weight="bold"> cse-mn-a</tspan></text>
<text x="44" y="135" font-family="DejaVu Sans Mono, monospace" font-size="13.5"><tspan fill="#9aa5b1">├─ </tspan><tspan fill="#1d1d1d" font-weight="bold">&lt;AE&gt;</tspan><tspan fill="#1d1d1d" font-weight="bold"> phone</tspan></text>
<text x="470" y="135" text-anchor="end" font-family="DejaVu Sans, sans-serif" font-size="12.5" fill="#666">phone-A, the vehicle</text>
<text x="44" y="158" font-family="DejaVu Sans Mono, monospace" font-size="13.5"><tspan fill="#9aa5b1">│  ├─ </tspan><tspan fill="#2e7d32" font-weight="bold">&lt;cnt&gt;</tspan><tspan fill="#1d1d1d" font-weight="bold"> imu</tspan></text>
<text x="470" y="158" text-anchor="end" font-family="DejaVu Sans, sans-serif" font-size="12.5" fill="#666">motion</text>
<text x="44" y="181" font-family="DejaVu Sans Mono, monospace" font-size="13.5"><tspan fill="#9aa5b1">│  ├─ </tspan><tspan fill="#2e7d32" font-weight="bold">&lt;cnt&gt;</tspan><tspan fill="#1d1d1d" font-weight="bold"> env</tspan></text>
<text x="470" y="181" text-anchor="end" font-family="DejaVu Sans, sans-serif" font-size="12.5" fill="#666">environment</text>
<text x="44" y="204" font-family="DejaVu Sans Mono, monospace" font-size="13.5"><tspan fill="#9aa5b1">│  ├─ </tspan><tspan fill="#2e7d32" font-weight="bold">&lt;cnt&gt;</tspan><tspan fill="#1d1d1d" font-weight="bold"> loc</tspan></text>
<text x="470" y="204" text-anchor="end" font-family="DejaVu Sans, sans-serif" font-size="12.5" fill="#666">position</text>
<text x="44" y="227" font-family="DejaVu Sans Mono, monospace" font-size="13.5"><tspan fill="#9aa5b1">│  ├─ </tspan><tspan fill="#2e7d32" font-weight="bold">&lt;cnt&gt;</tspan><tspan fill="#1d1d1d" font-weight="bold"> radio</tspan></text>
<text x="470" y="227" text-anchor="end" font-family="DejaVu Sans, sans-serif" font-size="12.5" fill="#666">cell and signal</text>
<text x="44" y="250" font-family="DejaVu Sans Mono, monospace" font-size="13.5"><tspan fill="#9aa5b1">│  │  └─ </tspan><tspan fill="#c25a00" font-weight="bold">&lt;sub&gt;</tspan><tspan fill="#1d1d1d" font-weight="bold"> (an app&#x27;s)</tspan></text>
<text x="470" y="250" text-anchor="end" font-family="DejaVu Sans, sans-serif" font-size="12.5" fill="#666">notifies that app</text>
<text x="44" y="273" font-family="DejaVu Sans Mono, monospace" font-size="13.5"><tspan fill="#9aa5b1">│  ├─ </tspan><tspan fill="#2e7d32" font-weight="bold">&lt;cnt&gt;</tspan><tspan fill="#1d1d1d" font-weight="bold"> wlan</tspan></text>
<text x="470" y="273" text-anchor="end" font-family="DejaVu Sans, sans-serif" font-size="12.5" fill="#666">Wi-Fi</text>
<text x="44" y="296" font-family="DejaVu Sans Mono, monospace" font-size="13.5"><tspan fill="#9aa5b1">│  ├─ </tspan><tspan fill="#2e7d32" font-weight="bold">&lt;cnt&gt;</tspan><tspan fill="#1d1d1d" font-weight="bold"> cmd</tspan></text>
<text x="470" y="296" text-anchor="end" font-family="DejaVu Sans, sans-serif" font-size="12.5" fill="#666">commands to the phone</text>
<text x="44" y="319" font-family="DejaVu Sans Mono, monospace" font-size="13.5"><tspan fill="#9aa5b1">│  │  └─ </tspan><tspan fill="#c25a00" font-weight="bold">&lt;sub&gt;</tspan><tspan fill="#1d1d1d" font-weight="bold"> cmdSub</tspan></text>
<text x="470" y="319" text-anchor="end" font-family="DejaVu Sans, sans-serif" font-size="12.5" fill="#666">to the polling channel</text>
<text x="44" y="342" font-family="DejaVu Sans Mono, monospace" font-size="13.5"><tspan fill="#9aa5b1">│  ├─ </tspan><tspan fill="#2e7d32" font-weight="bold">&lt;cnt&gt;</tspan><tspan fill="#1d1d1d" font-weight="bold"> ack</tspan></text>
<text x="470" y="342" text-anchor="end" font-family="DejaVu Sans, sans-serif" font-size="12.5" fill="#666">answers of the phone</text>
<text x="44" y="365" font-family="DejaVu Sans Mono, monospace" font-size="13.5"><tspan fill="#9aa5b1">│  ├─ </tspan><tspan fill="#6a1b9a" font-weight="bold">&lt;ts&gt;</tspan><tspan fill="#1d1d1d" font-weight="bold"> radioTs</tspan></text>
<text x="470" y="365" text-anchor="end" font-family="DejaVu Sans, sans-serif" font-size="12.5" fill="#666">numbered radio samples</text>
<text x="44" y="388" font-family="DejaVu Sans Mono, monospace" font-size="13.5"><tspan fill="#9aa5b1">│  └─ </tspan><tspan fill="#00838f" font-weight="bold">&lt;pch&gt;</tspan><tspan fill="#1d1d1d" font-weight="bold"> pch</tspan></text>
<text x="470" y="388" text-anchor="end" font-family="DejaVu Sans, sans-serif" font-size="12.5" fill="#666">the phone fetches commands</text>
<text x="44" y="411" font-family="DejaVu Sans Mono, monospace" font-size="13.5"><tspan fill="#9aa5b1">├─ </tspan><tspan fill="#b71c1c" font-weight="bold">&lt;acp&gt;</tspan><tspan fill="#1d1d1d" font-weight="bold"> phoneReadAcp</tspan></text>
<text x="470" y="411" text-anchor="end" font-family="DejaVu Sans, sans-serif" font-size="12.5" fill="#666">owner: all; reader: read</text>
<text x="44" y="434" font-family="DejaVu Sans Mono, monospace" font-size="13.5"><tspan fill="#9aa5b1">├─ </tspan><tspan fill="#1d1d1d" font-weight="bold">&lt;AE&gt;</tspan><tspan fill="#1d1d1d" font-weight="bold"> rsu</tspan></text>
<text x="470" y="434" text-anchor="end" font-family="DejaVu Sans, sans-serif" font-size="12.5" fill="#666">phone-B, the roadside sensor</text>
<text x="44" y="457" font-family="DejaVu Sans Mono, monospace" font-size="13.5"><tspan fill="#9aa5b1">│  └─ </tspan><tspan fill="#2e7d32" font-weight="bold">&lt;cnt&gt;</tspan><tspan fill="#1d1d1d" font-weight="bold"> imu, env, ...</tspan></text>
<text x="470" y="457" text-anchor="end" font-family="DejaVu Sans, sans-serif" font-size="12.5" fill="#666">as phone-A</text>
<text x="44" y="480" font-family="DejaVu Sans Mono, monospace" font-size="13.5"><tspan fill="#9aa5b1">└─ </tspan><tspan fill="#1d1d1d" font-weight="bold">&lt;AE&gt;</tspan><tspan fill="#1d1d1d" font-weight="bold"> mecPolicy</tspan></text>
<text x="470" y="480" text-anchor="end" font-family="DejaVu Sans, sans-serif" font-size="12.5" fill="#666">the edge&#x27;s own rules</text>
<text x="44" y="503" font-family="DejaVu Sans Mono, monospace" font-size="13.5"><tspan fill="#9aa5b1">   ├─ </tspan><tspan fill="#2e7d32" font-weight="bold">&lt;cnt&gt;</tspan><tspan fill="#1d1d1d" font-weight="bold"> constraint</tspan></text>
<text x="470" y="503" text-anchor="end" font-family="DejaVu Sans, sans-serif" font-size="12.5" fill="#666">which targets it admits</text>
<text x="44" y="526" font-family="DejaVu Sans Mono, monospace" font-size="13.5"><tspan fill="#9aa5b1">   └─ </tspan><tspan fill="#2e7d32" font-weight="bold">&lt;cnt&gt;</tspan><tspan fill="#1d1d1d" font-weight="bold"> violations</tspan></text>
<rect x="504" y="60" width="428" height="507" rx="12" fill="#f7f8fa" stroke="#9aa5b1" stroke-width="1.4"/>
