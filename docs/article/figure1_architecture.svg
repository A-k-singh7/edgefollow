<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" font-family="DejaVu Sans, Noto Sans, Liberation Sans, sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#3a3a3a"/>
    </marker>
    <marker id="ahO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c25a00"/>
    </marker>
    <marker id="ahB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f5fa8"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1200" height="800" fill="#ffffff"/>

  <text x="40" y="40" font-size="22" font-weight="bold" fill="#1d1d1d">EdgeFollow: logical architecture</text>

  <!-- Cloud -->
  <rect x="280" y="62" width="480" height="124" rx="14" fill="#eef3f8" stroke="#8aa1b8" stroke-width="1.5"/>
  <text x="296" y="84" font-size="15" font-weight="bold" fill="#33475b">Cloud</text>
  <rect x="300" y="94" width="196" height="78" rx="8" fill="#ffffff" stroke="#3a3a3a" stroke-width="1.5"/>
  <text x="398" y="115" font-size="15" font-weight="bold" text-anchor="middle" fill="#1d1d1d">Applications (AEs)</text>
  <text x="398" y="135" font-size="13" text-anchor="middle" fill="#444">handover orchestrator</text>
  <text x="398" y="151" font-size="13" text-anchor="middle" fill="#444">learning orchestrator</text>
  <text x="398" y="167" font-size="13" text-anchor="middle" fill="#444">context hub</text>
  <rect x="520" y="94" width="220" height="78" rx="8" fill="#ffffff" stroke="#3a3a3a" stroke-width="1.5"/>
  <text x="630" y="122" font-size="16" font-weight="bold" text-anchor="middle" fill="#1d1d1d">IN-CSE</text>
  <text x="630" y="142" font-size="13" text-anchor="middle" fill="#444">route to the device's edge</text>
  <text x="630" y="159" font-size="13" text-anchor="middle" fill="#444">handover rule, events</text>
  <line x1="496" y1="133" x2="518" y2="133" stroke="#3a3a3a" stroke-width="2"/>

  <!-- Edge A -->
  <rect x="50" y="250" width="510" height="276" rx="14" fill="#f4f8ef" stroke="#8fae7a" stroke-width="1.5"/>
  <text x="66" y="274" font-size="15" font-weight="bold" fill="#3d5a2a">Edge A (MEC host)</text>
  <rect x="72" y="288" width="214" height="128" rx="8" fill="#eaf1fb" stroke="#1f5fa8" stroke-width="1.5"/>
  <text x="179" y="310" font-size="15" font-weight="bold" text-anchor="middle" fill="#123d6e">MEC services</text>
  <text x="179" y="332" font-size="13" text-anchor="middle" fill="#1d2f45">MEC 011 app support</text>
  <text x="179" y="350" font-size="13" text-anchor="middle" fill="#1d2f45">MEC 012 radio (RNIS)</text>
  <text x="179" y="368" font-size="13" text-anchor="middle" fill="#1d2f45">MEC 013 location</text>
  <text x="179" y="386" font-size="13" text-anchor="middle" fill="#1d2f45">MEC 040 federation</text>
  <text x="179" y="404" font-size="13" text-anchor="middle" fill="#1d2f45">MEC 010-2 lifecycle (Mm1)</text>
  <rect x="326" y="288" width="214" height="128" rx="8" fill="#ffffff" stroke="#3a3a3a" stroke-width="1.5"/>
  <text x="433" y="310" font-size="15" font-weight="bold" text-anchor="middle" fill="#1d1d1d">MEC apps (AEs)</text>
  <text x="433" y="334" font-size="13" text-anchor="middle" fill="#444">location proxy (MEC-IPE)</text>
  <text x="433" y="352" font-size="13" text-anchor="middle" fill="#444">trusted learning client</text>
  <text x="433" y="370" font-size="13" text-anchor="middle" fill="#444">device proxy (non-oneM2M)</text>
  <line x1="288" y1="352" x2="324" y2="352" stroke="#1f5fa8" stroke-width="2" marker-start="url(#ahB)" marker-end="url(#ahB)"/>
  <text x="306" y="342" font-size="12" text-anchor="middle" fill="#1f5fa8">Mp1</text>
  <rect x="72" y="438" width="468" height="72" rx="8" fill="#ffffff" stroke="#3a3a3a" stroke-width="1.8"/>
  <text x="306" y="466" font-size="16" font-weight="bold" text-anchor="middle" fill="#1d1d1d">MN-CSE A</text>
  <text x="306" y="488" font-size="13" text-anchor="middle" fill="#444">device AEs, learning aggregator (an AE), ACPs</text>
  <line x1="433" y1="416" x2="433" y2="438" stroke="#3a3a3a" stroke-width="2"/>

  <!-- Edge B -->
  <rect x="640" y="250" width="510" height="276" rx="14" fill="#f4f8ef" stroke="#8fae7a" stroke-width="1.5"/>
  <text x="656" y="274" font-size="15" font-weight="bold" fill="#3d5a2a">Edge B (MEC host)</text>
  <rect x="662" y="288" width="214" height="128" rx="8" fill="#ffffff" stroke="#3a3a3a" stroke-width="1.5"/>
  <text x="769" y="310" font-size="15" font-weight="bold" text-anchor="middle" fill="#1d1d1d">MEC apps (AEs)</text>
  <text x="769" y="334" font-size="13" text-anchor="middle" fill="#444">as the scenario needs</text>
  <rect x="916" y="288" width="214" height="128" rx="8" fill="#eaf1fb" stroke="#1f5fa8" stroke-width="1.5"/>
  <text x="1023" y="310" font-size="15" font-weight="bold" text-anchor="middle" fill="#123d6e">MEC services</text>
  <text x="1023" y="332" font-size="13" text-anchor="middle" fill="#1d2f45">MEC 011 app support</text>
  <text x="1023" y="350" font-size="13" text-anchor="middle" fill="#1d2f45">MEC 012 radio (RNIS)</text>
  <text x="1023" y="368" font-size="13" text-anchor="middle" fill="#1d2f45">MEC 013 location</text>
  <text x="1023" y="386" font-size="13" text-anchor="middle" fill="#1d2f45">MEC 040 federation</text>
  <text x="1023" y="404" font-size="13" text-anchor="middle" fill="#1d2f45">MEC 010-2 lifecycle (Mm1)</text>
  <line x1="878" y1="352" x2="914" y2="352" stroke="#1f5fa8" stroke-width="2" marker-start="url(#ahB)" marker-end="url(#ahB)"/>
  <text x="896" y="342" font-size="12" text-anchor="middle" fill="#1f5fa8">Mp1</text>
  <rect x="662" y="438" width="468" height="72" rx="8" fill="#ffffff" stroke="#3a3a3a" stroke-width="1.8"/>
  <text x="896" y="466" font-size="16" font-weight="bold" text-anchor="middle" fill="#1d1d1d">MN-CSE B</text>
  <text x="896" y="488" font-size="13" text-anchor="middle" fill="#444">target of the move</text>
  <line x1="769" y1="416" x2="769" y2="438" stroke="#3a3a3a" stroke-width="2"/>

  <!-- Mcc: each MN-CSE registers to the IN-CSE, routed through the gap between the edges -->
  <path d="M 540 474 L 588 474 L 588 174" fill="none" stroke="#3a3a3a" stroke-width="2" marker-end="url(#ah)"/>
  <path d="M 662 474 L 612 474 L 612 174" fill="none" stroke="#3a3a3a" stroke-width="2" marker-end="url(#ah)"/>
  <text x="552" y="222" font-size="13" fill="#3a3a3a">Mcc</text>
  <text x="620" y="222" font-size="13" fill="#3a3a3a">Mcc</text>

  <!-- The move: from MN-CSE A to MN-CSE B, below the edges -->
  <path d="M 500 510 L 500 548 L 720 548 L 720 514" fill="none" stroke="#c25a00" stroke-width="3.5" marker-end="url(#ahO)"/>
  <text x="446" y="567" font-size="14" font-weight="bold" fill="#c25a00">handover: the AE, its subscriptions</text>
  <text x="446" y="584" font-size="14" font-weight="bold" fill="#c25a00">and its ACPs move to MN-CSE B</text>
  <text x="446" y="601" font-size="13" fill="#c25a00">started by a MEC 012 radio report or a policy rule</text>

  <!-- Phones -->
  <rect x="110" y="616" width="200" height="62" rx="10" fill="#ffffff" stroke="#7a7a7a" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="210" y="642" font-size="14" font-weight="bold" text-anchor="middle" fill="#555">phone-A (vehicle)</text>
  <text x="210" y="662" font-size="13" text-anchor="middle" fill="#666">before the move</text>
  <rect x="340" y="616" width="140" height="62" rx="10" fill="#ffffff" stroke="#3a3a3a" stroke-width="1.5"/>
  <text x="410" y="642" font-size="14" font-weight="bold" text-anchor="middle" fill="#1d1d1d">phone-B</text>
  <text x="410" y="662" font-size="13" text-anchor="middle" fill="#444">roadside sensor</text>
  <rect x="780" y="616" width="200" height="62" rx="10" fill="#ffffff" stroke="#3a3a3a" stroke-width="2"/>
  <text x="880" y="642" font-size="14" font-weight="bold" text-anchor="middle" fill="#1d1d1d">phone-A (vehicle)</text>
  <text x="880" y="662" font-size="13" text-anchor="middle" fill="#444">after the move</text>
  <path d="M 312 706 L 776 706" fill="none" stroke="#c25a00" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#ahO)"/>
  <text x="544" y="726" font-size="13" text-anchor="middle" fill="#c25a00">the vehicle drives on</text>

  <!-- Mca: each device to its MN-CSE -->
  <line x1="210" y1="614" x2="210" y2="514" stroke="#7a7a7a" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#ah)"/>
  <line x1="410" y1="614" x2="410" y2="514" stroke="#3a3a3a" stroke-width="1.8" marker-end="url(#ah)"/>
  <line x1="880" y1="614" x2="880" y2="514" stroke="#3a3a3a" stroke-width="1.8" marker-end="url(#ah)"/>
  <text x="218" y="600" font-size="13" fill="#555">Mca</text>
  <text x="402" y="600" font-size="13" text-anchor="end" fill="#3a3a3a">Mca</text>
  <text x="888" y="600" font-size="13" fill="#3a3a3a">Mca</text>

  <!-- Legend -->
  <line x1="1010" y1="624" x2="1048" y2="624" stroke="#3a3a3a" stroke-width="2"/>
  <text x="1056" y="629" font-size="13" fill="#3a3a3a">oneM2M</text>
  <line x1="1010" y1="648" x2="1048" y2="648" stroke="#1f5fa8" stroke-width="2"/>
  <text x="1056" y="653" font-size="13" fill="#3a3a3a">ETSI MEC</text>
  <line x1="1010" y1="672" x2="1048" y2="672" stroke="#c25a00" stroke-width="3"/>
  <text x="1056" y="677" font-size="13" fill="#3a3a3a">the move</text>

  <text x="40" y="766" font-size="13" fill="#555">Logical view. In the lab, all CSEs and MEC services operate on one PC. If MN-CSE B does not answer, the move</text>
  <text x="40" y="784" font-size="13" fill="#555">stops and the device stays at MN-CSE A.</text>
</svg>
