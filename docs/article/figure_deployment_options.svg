<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="640" viewBox="0 0 1240 640" font-family="DejaVu Sans, Noto Sans, Liberation Sans, sans-serif">
<defs>
<marker id="aK" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a3a3a"/></marker>
<marker id="aB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f5fa8"/></marker>
<marker id="aG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a7a7a"/></marker>
<marker id="aO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c25a00"/></marker>
<marker id="aR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b3261e"/></marker>
<marker id="aE" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/></marker>
</defs>
<rect x="0" y="0" width="1240" height="640" fill="#ffffff"/>
<text x="24" y="38" font-size="22" font-weight="bold" fill="#1d1d1d">TR-0086 deployment options, as EdgeFollow runs them</text>
<rect x="30" y="70" width="280" height="490" rx="12" fill="#fafafa" stroke="#bdbdbd" stroke-width="1.2" stroke-dasharray="6 4"/>
<text x="42" y="90" font-size="13" font-weight="bold" fill="#555555">Option A</text>
<text x="170" y="108" font-size="13" font-weight="bold" text-anchor="middle" fill="#1d1d1d">the location proxy as a MEC app,</text>
<text x="170" y="126" font-size="13" font-weight="bold" text-anchor="middle" fill="#1d1d1d">registered at the IN-CSE</text>
<rect x="60" y="160" width="220" height="64" rx="8" fill="#ffffff" stroke="#3a3a3a" stroke-width="1.6"/>
<text x="170" y="196" font-size="13" font-weight="bold" text-anchor="middle" fill="#1d1d1d">IN-CSE</text>
<rect x="60" y="280" width="220" height="64" rx="8" fill="#eaf1fb" stroke="#1f5fa8" stroke-width="1.6"/>
<text x="170" y="308" font-size="13" font-weight="bold" text-anchor="middle" fill="#1d1d1d">location proxy</text>
<text x="170" y="325" font-size="11" text-anchor="middle" fill="#555555">a MEC app and an AE</text>
<line x1="170" y1="280" x2="170" y2="226" stroke="#3a3a3a" stroke-width="2" marker-end="url(#aK)"/>
<rect x="60" y="400" width="220" height="64" rx="8" fill="#eaf1fb" stroke="#1f5fa8" stroke-width="1.6"/>
<text x="170" y="436" font-size="13" font-weight="bold" text-anchor="middle" fill="#1d1d1d">MEC 013</text>
<line x1="170" y1="400" x2="170" y2="346" stroke="#1f5fa8" stroke-width="2" marker-end="url(#aB)"/>
<text x="170" y="540" font-size="12" text-anchor="middle" fill="#555555">no MN-CSE; 21 tests</text>
<rect x="330" y="70" width="280" height="490" rx="12" fill="#fafafa" stroke="#bdbdbd" stroke-width="1.2" stroke-dasharray="6 4"/>
<text x="342" y="90" font-size="13" font-weight="bold" fill="#555555">Option B</text>
<text x="470" y="108" font-size="13" font-weight="bold" text-anchor="middle" fill="#1d1d1d">an MN-CSE beside</text>
<text x="470" y="126" font-size="13" font-weight="bold" text-anchor="middle" fill="#1d1d1d">the MEC services</text>
<rect x="360" y="160" width="220" height="64" rx="8" fill="#ffffff" stroke="#3a3a3a" stroke-width="1.6"/>
<text x="470" y="196" font-size="13" font-weight="bold" text-anchor="middle" fill="#1d1d1d">IN-CSE</text>
<rect x="360" y="280" width="220" height="64" rx="8" fill="#ffffff" stroke="#3a3a3a" stroke-width="1.6"/>
<text x="470" y="316" font-size="13" font-weight="bold" text-anchor="middle" fill="#1d1d1d">MN-CSE</text>
<line x1="470" y1="280" x2="470" y2="226" stroke="#3a3a3a" stroke-width="2" marker-end="url(#aK)"/>
<rect x="360" y="400" width="220" height="64" rx="8" fill="#eaf1fb" stroke="#1f5fa8" stroke-width="1.6"/>
<text x="470" y="436" font-size="13" font-weight="bold" text-anchor="middle" fill="#1d1d1d">MEC services</text>
<line x1="470" y1="400" x2="470" y2="346" stroke="#1f5fa8" stroke-width="2" marker-end="url(#aB)"/>
<text x="470" y="540" font-size="12" text-anchor="middle" fill="#555555">the lab itself; no tests of its own</text>
<rect x="630" y="70" width="280" height="490" rx="12" fill="#fafafa" stroke="#bdbdbd" stroke-width="1.2" stroke-dasharray="6 4"/>
<text x="642" y="90" font-size="13" font-weight="bold" fill="#555555">Option C</text>
<text x="770" y="108" font-size="13" font-weight="bold" text-anchor="middle" fill="#1d1d1d">the MN-CSE runs as</text>
<text x="770" y="126" font-size="13" font-weight="bold" text-anchor="middle" fill="#1d1d1d">a MEC application</text>
<rect x="660" y="160" width="220" height="64" rx="8" fill="#ffffff" stroke="#3a3a3a" stroke-width="1.6"/>
<text x="770" y="196" font-size="13" font-weight="bold" text-anchor="middle" fill="#1d1d1d">IN-CSE</text>
<rect x="660" y="280" width="220" height="64" rx="8" fill="#eaf1fb" stroke="#1f5fa8" stroke-width="1.6"/>
<text x="770" y="308" font-size="13" font-weight="bold" text-anchor="middle" fill="#1d1d1d">MN-CSE</text>
<text x="770" y="325" font-size="11" text-anchor="middle" fill="#555555">as a MEC app</text>
<line x1="770" y1="280" x2="770" y2="226" stroke="#3a3a3a" stroke-width="2" marker-end="url(#aK)"/>
<rect x="660" y="400" width="220" height="64" rx="8" fill="#eaf1fb" stroke="#1f5fa8" stroke-width="1.6"/>
<text x="770" y="428" font-size="13" font-weight="bold" text-anchor="middle" fill="#1d1d1d">MEC 010-2</text>
<text x="770" y="445" font-size="11" text-anchor="middle" fill="#555555">and the platform agent</text>
<line x1="770" y1="400" x2="770" y2="346" stroke="#1f5fa8" stroke-width="2" marker-end="url(#aB)"/>
<text x="770" y="540" font-size="12" text-anchor="middle" fill="#555555">MEC 010-2 lifecycle; C and D: 101 tests</text>
<rect x="930" y="70" width="280" height="490" rx="12" fill="#fafafa" stroke="#bdbdbd" stroke-width="1.2" stroke-dasharray="6 4"/>
<text x="942" y="90" font-size="13" font-weight="bold" fill="#555555">Option D</text>
<text x="1070" y="108" font-size="13" font-weight="bold" text-anchor="middle" fill="#1d1d1d">that MN-CSE, offered</text>
<text x="1070" y="126" font-size="13" font-weight="bold" text-anchor="middle" fill="#1d1d1d">as a MEC service</text>
<rect x="960" y="160" width="220" height="64" rx="8" fill="#ffffff" stroke="#3a3a3a" stroke-width="1.6"/>
<text x="1070" y="196" font-size="13" font-weight="bold" text-anchor="middle" fill="#1d1d1d">IN-CSE</text>
<rect x="960" y="280" width="220" height="64" rx="8" fill="#eaf1fb" stroke="#1f5fa8" stroke-width="1.6"/>
<text x="1070" y="308" font-size="13" font-weight="bold" text-anchor="middle" fill="#1d1d1d">MN-CSE as the service</text>
<text x="1070" y="325" font-size="11" text-anchor="middle" fill="#555555">onem2m-mn-cse</text>
<line x1="1070" y1="280" x2="1070" y2="226" stroke="#3a3a3a" stroke-width="2" marker-end="url(#aK)"/>
<rect x="960" y="400" width="220" height="64" rx="8" fill="#eaf1fb" stroke="#1f5fa8" stroke-width="1.6"/>
<text x="1070" y="428" font-size="13" font-weight="bold" text-anchor="middle" fill="#1d1d1d">a consumer app</text>
<text x="1070" y="445" font-size="11" text-anchor="middle" fill="#555555">finds it in MEC 011</text>
<line x1="1070" y1="400" x2="1070" y2="346" stroke="#1f5fa8" stroke-width="2" marker-end="url(#aB)"/>
<text x="1070" y="540" font-size="12" text-anchor="middle" fill="#555555">found through MEC 011</text>
<line x1="30" y1="595" x2="74" y2="595" stroke="#3a3a3a" stroke-width="2.5"/>
<text x="84" y="600" font-size="13" text-anchor="start" fill="#333">oneM2M registration (Mca for an AE, Mcc for an MN-CSE)</text>
<line x1="30" y1="617" x2="74" y2="617" stroke="#1f5fa8" stroke-width="2.5"/>
<text x="84" y="622" font-size="13" text-anchor="start" fill="#333">MEC: Mp1, Mm1 lifecycle, or service discovery in MEC 011</text>
</svg>
