<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="1080" viewBox="0 0 1320 1080" font-family="DejaVu Sans, Noto Sans, Liberation Sans, sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3a3a3a"/></marker>
    <marker id="ahB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f5fa8"/></marker>
    <marker id="ahG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7a7a7a"/></marker>
  </defs>
  <rect x="0" y="0" width="1320" height="1080" fill="#ffffff"/>
  <text x="24" y="38" font-size="22" font-weight="bold" fill="#1d1d1d">EdgeFollow: the move, as the runs with the real phones did it</text>
  <line x1="80" y1="120" x2="80" y2="958" stroke="#b5b5b5" stroke-width="1.5" stroke-dasharray="4 4"/>
  <rect x="8" y="62" width="144" height="58" rx="8" fill="#ffffff" stroke="#3a3a3a" stroke-width="1.5"/>
  <text x="80" y="86" font-size="15" font-weight="bold" text-anchor="middle" fill="#1d1d1d">phone-A</text>
  <text x="80" y="106" font-size="12" text-anchor="middle" fill="#444">vehicle app</text>
  <line x1="250" y1="120" x2="250" y2="958" stroke="#b5b5b5" stroke-width="1.5" stroke-dasharray="4 4"/>
  <rect x="178" y="62" width="144" height="58" rx="8" fill="#ffffff" stroke="#3a3a3a" stroke-width="1.5"/>
  <text x="250" y="86" font-size="15" font-weight="bold" text-anchor="middle" fill="#1d1d1d">MN-CSE A</text>
  <text x="250" y="106" font-size="12" text-anchor="middle" fill="#444">edge A</text>
  <line x1="430" y1="120" x2="430" y2="958" stroke="#b5b5b5" stroke-width="1.5" stroke-dasharray="4 4"/>
  <rect x="358" y="62" width="144" height="58" rx="8" fill="#eaf1fb" stroke="#1f5fa8" stroke-width="1.5"/>
  <text x="430" y="86" font-size="15" font-weight="bold" text-anchor="middle" fill="#1d1d1d">MEC 012</text>
  <text x="430" y="106" font-size="12" text-anchor="middle" fill="#444">radio info</text>
  <line x1="640" y1="120" x2="640" y2="958" stroke="#b5b5b5" stroke-width="1.5" stroke-dasharray="4 4"/>
  <rect x="568" y="62" width="144" height="58" rx="8" fill="#ffffff" stroke="#3a3a3a" stroke-width="1.5"/>
  <text x="640" y="86" font-size="15" font-weight="bold" text-anchor="middle" fill="#1d1d1d">Orchestrator</text>
  <text x="640" y="106" font-size="12" text-anchor="middle" fill="#444">an AE, on the PC</text>
  <line x1="850" y1="120" x2="850" y2="958" stroke="#b5b5b5" stroke-width="1.5" stroke-dasharray="4 4"/>
  <rect x="778" y="62" width="144" height="58" rx="8" fill="#ffffff" stroke="#3a3a3a" stroke-width="1.5"/>
  <text x="850" y="86" font-size="15" font-weight="bold" text-anchor="middle" fill="#1d1d1d">IN-CSE</text>
  <text x="850" y="106" font-size="12" text-anchor="middle" fill="#444">context hub, records</text>
  <line x1="1010" y1="120" x2="1010" y2="958" stroke="#b5b5b5" stroke-width="1.5" stroke-dasharray="4 4"/>
  <rect x="938" y="62" width="144" height="58" rx="8" fill="#eaf1fb" stroke="#1f5fa8" stroke-width="1.5"/>
  <text x="1010" y="86" font-size="15" font-weight="bold" text-anchor="middle" fill="#1d1d1d">MEC 040</text>
  <text x="1010" y="106" font-size="12" text-anchor="middle" fill="#444">federation</text>
  <line x1="1160" y1="120" x2="1160" y2="958" stroke="#b5b5b5" stroke-width="1.5" stroke-dasharray="4 4"/>
  <rect x="1088" y="62" width="144" height="58" rx="8" fill="#ffffff" stroke="#3a3a3a" stroke-width="1.5"/>
  <text x="1160" y="86" font-size="15" font-weight="bold" text-anchor="middle" fill="#1d1d1d">MN-CSE B</text>
  <text x="1160" y="106" font-size="12" text-anchor="middle" fill="#444">edge B</text>
  <line x1="83" y1="172" x2="246" y2="172" stroke="#3a3a3a" stroke-width="2" marker-end="url(#ah)"/>
  <text x="165" y="165" font-size="13" text-anchor="middle" fill="#1d1d1d" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">numbered samples, every 5 s</text>
  <line x1="433" y1="236" x2="636" y2="236" stroke="#1f5fa8" stroke-width="2" marker-end="url(#ahB)"/>
  <text x="535" y="229" font-size="13" text-anchor="middle" fill="#123d6e" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">RSRP below threshold</text>
  <text x="535" y="213" font-size="13" text-anchor="middle" fill="#123d6e" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">radio report:</text>
  <line x1="643" y1="300" x2="846" y2="300" stroke="#3a3a3a" stroke-width="2" marker-end="url(#ah)"/>
  <text x="745" y="293" font-size="13" text-anchor="middle" fill="#1d1d1d" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">acceptance record (a rule)</text>
  <text x="745" y="277" font-size="13" text-anchor="middle" fill="#1d1d1d" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">TRIGGERED; hub recommends;</text>
  <line x1="643" y1="348" x2="1006" y2="348" stroke="#1f5fa8" stroke-width="2" marker-end="url(#ahB)"/>
  <text x="825" y="341" font-size="13" text-anchor="middle" fill="#123d6e" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">list peers, select one for edge A</text>
  <line x1="1007" y1="396" x2="644" y2="396" stroke="#1f5fa8" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#ahB)"/>
  <text x="825" y="389" font-size="13" text-anchor="middle" fill="#123d6e" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">edge B</text>
  <line x1="643" y1="444" x2="846" y2="444" stroke="#3a3a3a" stroke-width="2" marker-end="url(#ah)"/>
  <text x="745" y="437" font-size="13" text-anchor="middle" fill="#1d1d1d" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">open the handover transaction</text>
  <line x1="637" y1="492" x2="84" y2="492" stroke="#7a7a7a" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#ahG)"/>
  <text x="360" y="485" font-size="13" text-anchor="middle" fill="#555" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">pause the stream</text>
  <line x1="643" y1="540" x2="1156" y2="540" stroke="#3a3a3a" stroke-width="2" marker-end="url(#ah)"/>
  <text x="900" y="533" font-size="13" text-anchor="middle" fill="#1d1d1d" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">AE + 5 containers; every sample copied, bit-identical</text>
  <line x1="643" y1="588" x2="1156" y2="588" stroke="#3a3a3a" stroke-width="2" marker-end="url(#ah)"/>
  <text x="900" y="581" font-size="13" text-anchor="middle" fill="#1d1d1d" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">ACPs (reader yes, stranger no), subscription S1</text>
  <line x1="637" y1="636" x2="84" y2="636" stroke="#7a7a7a" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#ahG)"/>
  <text x="360" y="629" font-size="13" text-anchor="middle" fill="#555" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">restart the app's service, pointed at edge B</text>
  <line x1="83" y1="684" x2="1156" y2="684" stroke="#3a3a3a" stroke-width="2" marker-end="url(#ah)"/>
  <text x="620" y="677" font-size="13" text-anchor="middle" fill="#1d1d1d" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">new samples; S1 notifies its subscriber</text>
  <line x1="643" y1="732" x2="846" y2="732" stroke="#3a3a3a" stroke-width="2" marker-end="url(#ah)"/>
  <text x="745" y="725" font-size="13" text-anchor="middle" fill="#1d1d1d" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">serving edge: B</text>
  <line x1="637" y1="780" x2="254" y2="780" stroke="#3a3a3a" stroke-width="2" marker-end="url(#ah)"/>
  <text x="445" y="773" font-size="13" text-anchor="middle" fill="#1d1d1d" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">release the AE (edge A then answers 404)</text>
  <line x1="643" y1="828" x2="846" y2="828" stroke="#3a3a3a" stroke-width="2" marker-end="url(#ah)"/>
  <text x="745" y="821" font-size="13" text-anchor="middle" fill="#1d1d1d" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">COMPLETED; transaction closed</text>
  <line x1="643" y1="876" x2="1156" y2="876" stroke="#3a3a3a" stroke-width="2" marker-end="url(#ah)"/>
  <text x="900" y="869" font-size="13" text-anchor="middle" fill="#1d1d1d" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">after the move: a command for the vehicle (ping)</text>
  <line x1="83" y1="924" x2="1156" y2="924" stroke="#3a3a3a" stroke-width="2" marker-end="url(#ah)"/>
  <text x="620" y="917" font-size="13" text-anchor="middle" fill="#1d1d1d" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">poll (pollingChannel), take the command, acknowledge</text>
  <path d="M1254,236 H1262 V828 H1254" fill="none" stroke="#c25a00" stroke-width="2"/>
  <text x="1277" y="532" font-size="13" font-weight="bold" fill="#c25a00" text-anchor="middle" transform="rotate(-90 1277 532)">trigger to completed: 16.5 to 16.6 s</text>
  <path d="M1284,492 H1292 V684 H1284" fill="none" stroke="#c25a00" stroke-width="2"/>
  <text x="1307" y="588" font-size="13" font-weight="bold" fill="#c25a00" text-anchor="middle" transform="rotate(-90 1307 588)">no samples: about 8.7 s</text>
  <line x1="40" y1="998" x2="90" y2="998" stroke="#3a3a3a" stroke-width="2" marker-end="url(#ah)"/>
  <text x="102" y="1003" font-size="13" fill="#333">oneM2M request (HTTP)</text>
  <line x1="340" y1="998" x2="390" y2="998" stroke="#1f5fa8" stroke-width="2" marker-end="url(#ahB)"/>
  <text x="402" y="1003" font-size="13" fill="#333">ETSI MEC API (HTTP)</text>
  <line x1="640" y1="998" x2="690" y2="998" stroke="#7a7a7a" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#ahG)"/>
  <text x="702" y="1003" font-size="13" fill="#333">USB command from the PC to the phone app (lab only)</text>
  <text x="24" y="1038" font-size="13" fill="#555">Times: runs 1 to 3 at a 5 s period. The orchestrator writes the acceptance record by a rule; in the simulated tests, it also checks MEC 011 and uses an</text>
  <text x="24" y="1056" font-size="13" fill="#555">announced AE as the route. Records: poc2_run1.json to poc2_run3.json.</text>
</svg>
