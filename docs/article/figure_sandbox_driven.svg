<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="720" viewBox="0 0 1240 720" font-family="DejaVu Sans, Noto Sans, Liberation Sans, sans-serif">
<defs>
<marker id="aK" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a3a3a"/></marker>
<marker id="aB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f5fa8"/></marker>
<marker id="aG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a7a7a"/></marker>
<marker id="aO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c25a00"/></marker>
<marker id="aR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b3261e"/></marker>
<marker id="aE" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/></marker>
</defs>
<rect x="0" y="0" width="1240" height="720" fill="#ffffff"/>
<text x="24" y="38" font-size="22" font-weight="bold" fill="#1d1d1d">ETSI's hosted MEC Sandbox drives the move</text>
<rect x="30" y="70" width="560" height="560" rx="12" fill="#f5f9fe" stroke="#9bb7dc" stroke-width="1.2" stroke-dasharray="6 4"/>
<text x="42" y="90" font-size="13" font-weight="bold" fill="#555555">ETSI MEC Sandbox (hosted by ETSI, 8 network scenarios)</text>
<rect x="60" y="110" width="240" height="160" rx="8" fill="#ffffff" stroke="#9bb7dc" stroke-width="1.6"/>
<text x="180" y="186" font-size="13" font-weight="bold" text-anchor="middle" fill="#1d1d1d">zone01</text>
<text x="180" y="203" font-size="11" text-anchor="middle" fill="#555555">radio cells (Wi-Fi in some scenarios)</text>
<rect x="320" y="110" width="240" height="160" rx="8" fill="#ffffff" stroke="#9bb7dc" stroke-width="1.6"/>
<text x="440" y="186" font-size="13" font-weight="bold" text-anchor="middle" fill="#1d1d1d">zone02</text>
<text x="440" y="203" font-size="11" text-anchor="middle" fill="#555555">radio cells (Wi-Fi in some scenarios)</text>
<rect x="60" y="300" width="240" height="160" rx="8" fill="#ffffff" stroke="#9bb7dc" stroke-width="1.6"/>
<text x="180" y="376" font-size="13" font-weight="bold" text-anchor="middle" fill="#1d1d1d">zone03</text>
<text x="180" y="393" font-size="11" text-anchor="middle" fill="#555555">radio cells (Wi-Fi in some scenarios)</text>
<rect x="320" y="300" width="240" height="160" rx="8" fill="#ffffff" stroke="#9bb7dc" stroke-width="1.6"/>
<text x="440" y="376" font-size="13" font-weight="bold" text-anchor="middle" fill="#1d1d1d">zone04</text>
<text x="440" y="393" font-size="11" text-anchor="middle" fill="#555555">radio cells (Wi-Fi in some scenarios)</text>
<circle cx="250" cy="260" r="9" fill="#c25a00"/>
<line x1="250" y1="300" x2="360" y2="220" stroke="#c25a00" stroke-width="2" marker-end="url(#aO)"/>
<text x="330" y="290" font-size="11" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" fill="#c25a00">a simulated user</text>
<text x="330" y="304" font-size="11" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" fill="#c25a00">drives into the</text>
<text x="330" y="318" font-size="11" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" fill="#c25a00">next zone</text>
<rect x="60" y="500" width="500" height="100" rx="8" fill="#eaf1fb" stroke="#1f5fa8" stroke-width="1.6"/>
<text x="310" y="537" font-size="13" font-weight="bold" text-anchor="middle" fill="#1d1d1d">MEC 013 location API</text>
<text x="310" y="554" font-size="11" text-anchor="middle" fill="#555555">on mep1 (and mep2 in two-platform scenarios):</text>
<text x="310" y="571" font-size="11" text-anchor="middle" fill="#555555">which zone serves each user</text>
<rect x="700" y="120" width="480" height="120" rx="8" fill="#ffffff" stroke="#3a3a3a" stroke-width="1.6"/>
<text x="940" y="167" font-size="14" font-weight="bold" text-anchor="middle" fill="#1d1d1d">Driver on the lab PC</text>
<text x="940" y="185" font-size="12" text-anchor="middle" fill="#555555">asks MEC 013 every 2 s (HTTPS);</text>
<text x="940" y="203" font-size="12" text-anchor="middle" fill="#555555">when the followed user enters the next zone: move</text>
<line x1="560" y1="550" x2="700" y2="200" stroke="#1f5fa8" stroke-width="2" marker-end="url(#aB)"/>
<text x="640" y="420" font-size="12" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" fill="#1f5fa8">polled: the Sandbox</text>
<text x="640" y="435" font-size="12" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" fill="#1f5fa8">cannot call my PC</text>
<rect x="700" y="300" width="480" height="80" rx="8" fill="#ffffff" stroke="#3a3a3a" stroke-width="1.6"/>
<text x="940" y="336" font-size="14" font-weight="bold" text-anchor="middle" fill="#1d1d1d">Handover library</text>
<text x="940" y="354" font-size="12" text-anchor="middle" fill="#555555">with the route checks of figure 5</text>
<line x1="940" y1="240" x2="940" y2="300" stroke="#3a3a3a" stroke-width="2" marker-end="url(#aK)"/>
<rect x="700" y="440" width="220" height="90" rx="8" fill="#ffffff" stroke="#3a3a3a" stroke-width="1.6"/>
<text x="810" y="481" font-size="14" font-weight="bold" text-anchor="middle" fill="#1d1d1d">MN-CSE A</text>
<text x="810" y="499" font-size="12" text-anchor="middle" fill="#555555">zone A's edge</text>
<rect x="960" y="440" width="220" height="90" rx="8" fill="#ffffff" stroke="#3a3a3a" stroke-width="1.6"/>
<text x="1070" y="481" font-size="14" font-weight="bold" text-anchor="middle" fill="#1d1d1d">MN-CSE B</text>
<text x="1070" y="499" font-size="12" text-anchor="middle" fill="#555555">zone B's edge</text>
<line x1="920" y1="485" x2="960" y2="485" stroke="#3a3a3a" stroke-width="2" marker-end="url(#aK)"/>
<line x1="940" y1="380" x2="810" y2="440" stroke="#3a3a3a" stroke-width="2" marker-end="url(#aK)"/>
<line x1="940" y1="380" x2="1070" y2="440" stroke="#3a3a3a" stroke-width="2" marker-end="url(#aK)"/>
<text x="700" y="576" font-size="14" font-weight="bold" text-anchor="start" fill="#1d1d1d">9 of 10 runs completed, in all 8 scenarios;</text>
<text x="700" y="597" font-size="13" text-anchor="start" fill="#1d1d1d">each move took 0.24 to 0.30 s; edge A answered 404 afterwards;</text>
<text x="700" y="617" font-size="13" text-anchor="start" fill="#1d1d1d">the tenth run correctly did not move.</text>
<text x="700" y="643" font-size="13" text-anchor="start" fill="#555555">Polled, so the trigger is up to 2 s late; the users are simulated.</text>
<text x="700" y="665" font-size="12" text-anchor="start" fill="#555555">Records: records/sandbox/ (the Sandbox's address is not published).</text>
</svg>
