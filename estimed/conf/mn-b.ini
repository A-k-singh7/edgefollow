; ESTIMED topology - mn-b (MN-CSE)
; Generated for ESTIMED Hackathon #2. Runtime data lives outside the repo.
[basic.config]
cseType=MN
serviceProviderID=//estimed.example.com
cseID=id-mn-b
cseName=cse-mn-b
adminID=CAdmin
baseDirectory=/home/edgefollow/estimed-run/mn-b
initDirectory=/home/edgefollow/estimed-venv/lib/python3.13/site-packages/acmecse/init
consoleTheme=dark
consoleType=simple
databaseType=memory
httpPort=8202
cseHost=127.0.0.1
logLevel=warn
networkInterface=127.0.0.1
secret=estimed-demo-secret
registrarCseHost=127.0.0.1
registrarCsePort=8200
registrarCseID=id-in
registrarCseName=cse-in

; Run the CSE with --headless (no text UI) but keep diagnosable logs.
; --headless alone suppresses ALL logging, including the fatal startup errors:
; a misconfigured CSE then prints only the banner and exits 0. File logging is
; what makes headless operation debuggable.
[logging]
enableFileLogging=true
enableScreenLogging=false
stackTraceOnError=true
