; ESTIMED topology - in (IN-CSE)
; Generated for ESTIMED Hackathon #2. Runtime data lives outside the repo.
[basic.config]
cseType=IN
serviceProviderID=//estimed.example.com
cseID=id-in
cseName=cse-in
adminID=CAdmin
baseDirectory=/home/edgefollow/estimed-run/in
initDirectory=/home/edgefollow/estimed-venv/lib/python3.13/site-packages/acmecse/init
consoleTheme=dark
consoleType=simple
databaseType=memory
httpPort=8200
cseHost=127.0.0.1
logLevel=warn
networkInterface=127.0.0.1
secret=estimed-demo-secret
; An IN-CSE is the top of the hierarchy and must NOT have a registrar:
; RemoteCSEServiceConfiguration rejects a registrar cseID other than "/".
registrarCseHost=127.0.0.1
registrarCsePort=8200
registrarCseID=
registrarCseName=

; Run the CSE with --headless (no text UI) but keep diagnosable logs.
; --headless alone suppresses ALL logging, including the fatal startup errors:
; a misconfigured CSE then prints only the banner and exits 0. File logging is
; what makes headless operation debuggable.
[logging]
enableFileLogging=true
enableScreenLogging=false
stackTraceOnError=true

; The registrar must explicitly permit registree CSEs: allowedCSROriginators is
; EMPTY by default, so an MN-CSE's registration is refused with RSC 4103
; ("originator ... has no CREATE privileges for resource: id-in").
;
; NOTE the ids need a LEADING SLASH here. acme.ini.default documents this key as
; "CSE-IDs must not have a leading /", but the validator rejects that form with
;   Invalid originator: "id-mn-a" ... Must be a CSE-ID in absolute or SP-relative form
; SP-relative means "/id-mn-a". The template comment and the validator disagree.
[cse.registration]
allowedCSROriginators=/id-mn-a,/id-mn-b
