; ESTIMED TR-0086 options C and D - mn-c (MN-CSE), started by the MEC application estimed/apps/mn_cse.
; Derived from estimed/conf/mn-a.ini. Changed: cseID, cseName, httpPort; registrarCseHost and registrarCsePort are
; filled in by mn_cse.py from the registrar address the platform gives the instance. Removed: the baseDirectory
; line. mn_cse.py starts ACME with --base-directory under the instance's own folder, and a baseDirectory line here
; would override that for ACME's log path (lab-test defect, 2026-11-20).
[basic.config]
cseType=MN
serviceProviderID=//estimed.example.com
cseID=id-mn-c
cseName=cse-mn-c
adminID=CAdmin
initDirectory=/home/edgefollow/estimed-venv/lib/python3.13/site-packages/acmecse/init
consoleTheme=dark
consoleType=simple
databaseType=memory
httpPort=8203
cseHost=127.0.0.1
logLevel=warn
networkInterface=127.0.0.1
secret=estimed-demo-secret
registrarCseHost=@REGISTRAR_HOST@
registrarCsePort=@REGISTRAR_PORT@
registrarCseID=id-in
registrarCseName=cse-in

; Run the CSE with --headless (no text UI) but keep diagnosable logs.
; --headless alone suppresses ALL logging, including the fatal startup errors:
; a misconfigured CSE then prints only the banner and exits 0. File logging is
; what makes headless operation debuggable.
[logging]
enableFileLogging=true
enableScreenLogging=false
stackTraceOnError=true
